<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Dark is the default theme; only an explicit "light" choice opts out.
      try {
        if (localStorage.getItem("theme") !== "light")
          document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Invoicely | Free Online Invoice Generator for Freelancers</title>

    <!-- General SEO Metadata -->
    <meta
      name="description"
      content="Invoicely is a free, secure online invoice generator for freelancers. Create, manage, and download professional multi-currency PDF invoices instantly."
    />
    <meta
      name="keywords"
      content="invoice generator, free invoicing app, billing software, online invoice creator, PDF invoice, contractor billing, freelancer invoices, Invoicely, Supabase invoice, free invoice app for small business"
    />
    <meta name="author" content="Invoicely" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://invoicely.online" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://invoicely.online" />
    <meta
      property="og:title"
      content="Invoicely | Free Online Invoice Generator for Freelancers"
    />
    <meta
      property="og:description"
      content="Generate, manage, and download professional vector PDF invoices with ease. Secure, fast, and 100% free for freelancers and small businesses."
    />
    <meta
      property="og:image"
      content="https://invoicely.online/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Invoicely: write the invoice, download the PDF." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="invoicely.online" />
    <meta property="twitter:url" content="https://invoicely.online" />
    <meta
      property="twitter:title"
      content="Invoicely | Free Online Invoice Generator for Freelancers"
    />
    <meta
      property="twitter:description"
      content="Draft and download professional itemized invoices with multiple currency support in seconds. Secure hosting by Supabase."
    />
    <meta
      property="twitter:image"
      content="https://invoicely.online/og.png"
    />

    <!-- Apple Web App Metadata -->
    <meta name="apple-mobile-web-app-title" content="Invoicely" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
